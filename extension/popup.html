<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Anywhere Browser</title></head>
<body>
  <main>
    <header><img src="icon-32.png" width="24" height="24" alt=""><strong>Anywhere</strong><span class="pill">浏览器</span><details><summary aria-label="更多设置">···</summary><div class="menu"><button id="revoke">更换会话 / 撤销授权</button><button id="disconnect">断开 Anywhere</button></div></details></header>
    <div id="status" role="status" aria-live="polite">正在连接…</div>
    <section id="setup"><label for="url">Anywhere 地址或配对链接</label><input id="url" type="password" placeholder="https://your-anywhere/#pair=…" autocomplete="off" spellcheck="false"><button id="connect" class="primary">连接 Anywhere</button><p class="hint">首次连接需要新的单次配对链接。Relay 需允许此扩展的 Origin：</p><code id="extension-origin"></code></section>
    <section id="selection" hidden><label for="environment">运行环境</label><select id="environment"></select><label for="session">继续哪个 Session</label><select id="session"></select><p class="hint">授权后，在这个原会话中对话，即可读取、点击、输入和滚动当前页。PC 和 ECS 均可。</p><button id="grant" class="primary">授权当前页面</button><p class="fine">页面内容会端到端加密发给选中的环境。操作可能改变网站数据，请仅授权可信页面。</p></section>
    <section id="authorized" hidden><div class="connected-icon">✓</div><h1>已连接到会话</h1><p id="task"></p><p id="page" class="hint"></p><p class="fine">回到 Anywhere，继续这个 Session 即可操作。授权无倒计时；页面导航后需重新授权。</p></section>
    <button id="cancel" class="secondary" hidden>取消连接</button>
  </main>
  <script type="module" src="/src/popup.ts"></script>
</body></html>
