services:
  bridge:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3300
      BRIDGE_TRUST_PROXY: ${BRIDGE_TRUST_PROXY:-1}
      BRIDGE_EXTENSION_ORIGINS: ${BRIDGE_EXTENSION_ORIGINS:-}
      BRIDGE_CONNECTOR_TOKEN: ${BRIDGE_CONNECTOR_TOKEN:?set BRIDGE_CONNECTOR_TOKEN in .env}
      BRIDGE_SESSION_MAX_AGE_MS: ${BRIDGE_SESSION_MAX_AGE_MS:-3600000}
      BRIDGE_DEVICE_REGISTRY_FILE: /data/devices.json
      CODEX_UI_LANGUAGE: ${CODEX_UI_LANGUAGE:-zh-CN}
    ports:
      - "127.0.0.1:3300:3300"
    read_only: true
    pids_limit: 128
    stop_grace_period: 15s
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - bridge-state:/data
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bridge-state:
